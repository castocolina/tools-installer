[[tool]]
id = "opengsd"
name = "OpenGSD"
category = "ai"
cmd = "opengsd"
priority = "P3"
audience = "human"
desc = "Guided cross-runtime workflow installer; uninstall with its runtime, scope, and --uninstall flags."
tier = "ai"
[[tool.method]]
kind = "skill_pack"
[tool.skill_lifecycle]
source = "https://github.com/open-gsd/gsd-core"
owner = "open-gsd"
supported_harnesses = ["claude", "codex", "opencode", "antigravity", "cursor", "windsurf", "copilot", "kimi", "kilo"]
revision_policy = "package-manager-latest"
targets = [
  { scope = "global", path = "<selected-runtime-global-dir>" },
  { scope = "project", path = "<project>/<selected-runtime-dir>" },
]
[tool.skill_lifecycle.install]
mode = "manual-required"
instructions = [
  "After leaving the installer, run the required guided cross-runtime installer in a console:",
  "npx @opengsd/gsd-core@latest",
  "Select the runtime and global or local scope; do not copy files from the repository.",
]
[tool.skill_lifecycle.status]
mode = "manual-required"
instructions = [
  "Use the OpenGSD installer for the selected runtime and scope to verify its managed installation; a generated-file guess is not authoritative.",
]
[tool.skill_lifecycle.update]
mode = "manual-required"
instructions = [
  "From the installed agent runtime, invoke the documented update workflow:",
  "/gsd-update",
]
[tool.skill_lifecycle.removal]
mode = "manual-required"
instructions = [
  "Re-run the official installer with the same runtime and scope selected at install time and its uninstall flag:",
  "npx @opengsd/gsd-core@latest --<runtime> --global|--local --uninstall",
]



[[tool]]
id = "spec-kit"
name = "GitHub Spec Kit"
category = "dev"
cmd = "specify"
priority = "P2"
audience = "human"
desc = "Official Specify CLI plus guided project integration; uninstall the CLI with uv tool uninstall."
tier = "ai"
requires = ["uv"]
[[tool.method]]
kind = "skill_pack"
[tool.skill_lifecycle]
source = "https://github.com/github/spec-kit"
owner = "github"
supported_harnesses = ["claude", "codex", "opencode", "antigravity", "cursor"]
revision_policy = "package-manager-latest"
targets = [
  { scope = "global", path = "<uv-tool-dir>/specify-cli" },
  { scope = "project", path = "<project>/.specify" },
  { scope = "project", path = "<project>/<selected-agent-dir>" },
]
[tool.skill_lifecycle.install]
mode = "manual-required"
instructions = [
  "After leaving the installer, set PROJECT_DIR to an absolute, user-approved project directory, then run:",
  "PROJECT_DIR=/absolute/path/to/project",
  "uv tool install specify-cli",
  "specify init \"$PROJECT_DIR\"",
]
[tool.skill_lifecycle.status]
mode = "manual-required"
instructions = [
  "In the initialized project, run specify integration list and inspect .specify plus the selected integration; the specify binary alone is not project status.",
]
[tool.skill_lifecycle.update]
mode = "manual-required"
instructions = [
  "Upgrade the official CLI, then refresh the selected integration from the initialized project:",
  "uv tool upgrade specify-cli",
  "specify integration upgrade",
]
[tool.skill_lifecycle.removal]
mode = "manual-required"
instructions = [
  "From each initialized project, remove its tracked integration before removing the CLI:",
  "specify integration uninstall",
  "uv tool uninstall specify-cli",
]
