# tools-installer registry — single declarative source of truth.
# Each [[tool]] declares one or more [[tool.method]] entries. The resolver
# (installer/resolve.py) filters them to the platform and orders them by the
# priority ladder: script -> userspace download -> native pkg manager -> brew.

# Category blurbs shown in the wizard's category menu (hover description).
[[category]]
id = "pkg-mgr"
desc = "Package and environment managers"
[[category]]
id = "search"
desc = "Find files and code at speed"
[[category]]
id = "data"
desc = "Query and transform JSON, YAML and CSV"
[[category]]
id = "view"
desc = "View and render files in the terminal"
[[category]]
id = "text"
desc = "Text find-and-replace"
[[category]]
id = "git"
desc = "Git workflows, diffs and UIs"
[[category]]
id = "nav"
desc = "Jump around the filesystem"
[[category]]
id = "shell"
desc = "Prompt, env and shell ergonomics"
[[category]]
id = "dev"
desc = "Build, lint and docs helpers"
[[category]]
id = "sysinfo"
desc = "System monitors and disk usage"
[[category]]
id = "net"
desc = "HTTP clients"
[[category]]
id = "docker"
desc = "Container inspection and management"
[[category]]
id = "ai"
desc = "AI assistants in the terminal"
[[category]]
id = "runtime"
desc = "Language runtimes and version managers"
[[category]]
id = "security"
desc = "Secret scanning and security checks"
[[category]]
id = "editor"
desc = "GUI editors (macOS app installs)"
[[category]]
id = "diagram"
desc = "Diagram and chart generators"

[[tool]]
id = "uv"
name = "uv"
category = "pkg-mgr"
cmd = "uv"
priority = "P0"
audience = "both"
tier = "system"
desc = "Fast Python package and venv manager"
[[tool.method]]
kind = "script"
url = "https://astral.sh/uv/install.sh"
shell = "sh"
bin_dir = "~/.local/bin"
[[tool.method]]
kind = "brew"
formula = "uv"

[[tool]]
id = "rg"
name = "ripgrep"
category = "search"
cmd = "rg"
priority = "P0"
audience = "ai"
tier = "ai"
desc = "Replaces recursive grep with faster code search, .gitignore awareness, and focused output for agents."
[[tool.method]]
kind = "github_release"
os = ["debian", "arch", "fedora"]
repo = "BurntSushi/ripgrep"
asset = "ripgrep-{ver}-{arch.machine}-unknown-linux-musl.tar.gz"
checksum = "{asset}.sha256"
member = "rg"
strip = 1
[[tool.method]]
kind = "github_release"
os = ["macos"]
repo = "BurntSushi/ripgrep"
asset = "ripgrep-{ver}-{arch.machine}-apple-darwin.tar.gz"
checksum = "{asset}.sha256"
member = "rg"
strip = 1
[[tool.method]]
kind = "dnf"
package = "ripgrep"
[[tool.method]]
kind = "apt"
package = "ripgrep"
[[tool.method]]
kind = "pacman"
package = "ripgrep"
[[tool.method]]
kind = "brew"
formula = "ripgrep"

