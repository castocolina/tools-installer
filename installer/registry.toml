# Verified 2026-09-06: the Homebrew formula `zsh` was confirmed live against
# formulae.brew.sh/api/formula/zsh.json this session (stable 5.9.2, no caveats,
# cross-platform bottle). The four-method shape is an exact mirror of the
# already-shipped, already-tested podman entry, so the immutable-Linux-falls-
# to-brew mechanism needs no new proof, only new data. Unlike gnu-bash
# (07-02-PLAN.md), cmd = "zsh" needs no false-positive guard: macOS has shipped
# zsh as its default login shell since Catalina, and that system zsh is a real,
# sufficiently modern build that genuinely satisfies Oh-My-Zsh's own
# command_exists zsh prerequisite check, so is_installed reporting "already
# satisfied" on a stock Mac is correct, not a false positive.
[[tool]]
id = "zsh"
name = "Zsh"
category = "shell"
cmd = "zsh"
priority = "P1"
audience = "both"
tier = "system"
desc = "Feature-rich shell; prerequisite for Oh-My-Zsh."
[[tool.method]]
kind = "dnf"
package = "zsh"
[[tool.method]]
kind = "apt"
package = "zsh"
[[tool.method]]
kind = "pacman"
package = "zsh"
[[tool.method]]
kind = "brew"
formula = "zsh"

# Verified 2026-09-06: install.sh's non-TTY auto-detection sets RUNZSH=no /
# CHSH=no / OVERWRITE_CONFIRMATION=no but leaves KEEP_ZSHRC at its unsafe
# default no — OVERWRITE_CONFIRMATION=no means "skip the prompt and overwrite,"
# not "don't overwrite" — so env sets all three explicitly. CHSH=no is also a
# Bazzite correctness requirement (ublue-os/bazzite#4159 ties chsh-to-zsh to
# KDE/SDDM login failures) — never relax it. This session's Tier-3 container
# reproduction confirmed a pre-existing .zshrc survives byte-identical with no
# backup, and a fresh-user .zshrc is created with an editable plugins=(...)
# array — see 07-01-SUMMARY.md. detect_path short-circuits a second run to
# ALREADY_INSTALLED, the same protection sdkman already relies on; re-check if
# install.sh's version/logic changes materially. setup_ohmyzsh() hard-requires
# git (command_exists git) and clones entirely via git — no non-git path —
# which is why requires = ["zsh", "git"]. The unpinned master/HEAD URL matches
# the already-accepted brew entry precedent (Homebrew/install/HEAD/install.sh).
[[tool]]
id = "oh-my-zsh"
name = "Oh My Zsh"
category = "shell"
cmd = "omz"
priority = "P2"
audience = "both"
tier = "system"
requires = ["zsh", "git"]
desc = "Zsh configuration framework; installs into ~/.oh-my-zsh and edits .zshrc, preserving it via KEEP_ZSHRC."
[[tool.method]]
kind = "script"
url = "https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh"
shell = "sh"
env = { RUNZSH = "no", CHSH = "no", KEEP_ZSHRC = "yes" }
detect_path = "~/.oh-my-zsh/oh-my-zsh.sh"

# Verified 2026-09-06: the real Homebrew formula name is bash, not gnu-bash
# (confirmed live, formulae.brew.sh/api/formula/bash.json, stable 5.3.15,
# keg_only unset; the only caveat is DEFAULT_LOADABLE_BUILTINS_PATH — no
# PATH-shadowing warning, because Homebrew's bash installs to its own prefix
# (/opt/homebrew/bin/bash on Apple Silicon, /usr/local/bin/bash on Intel),
# coexisting with macOS's SIP-protected /bin/bash rather than replacing it).
# Detection design, load-bearing not stylistic: macOS ships /bin/bash
# (ancient, always present) on every Mac; if cmd were the literal string
# "bash", is_installed's unconditional shutil.which("bash") check would find
# that system binary and report this entry ALREADY_INSTALLED on every Mac,
# permanently, before Homebrew's build is ever installed — install_tool would
# never even attempt brew install bash, on any machine, ever. cmd = "gnu-bash"
# is a probe name no installer ever creates, so shutil.which correctly
# returns None and is_installed falls through to each method's detect_path,
# which checks Homebrew's real, absolute, prefix-specific install location —
# the same two-step which()-then-detect_path mechanism sdkman's entry already
# relies on for an analogous "the real command name is not reliably
# which-able" reason, applied here to solve a same-named-binary collision
# instead. Two brew methods are declared, split by arch, because
# resolve_methods's arch gate must select only the one applicable install
# method for THIS machine, while is_installed's detect_path loop (which does
# not filter by arch) must still recognize either absolute path as a valid
# "already installed" signal regardless of which method would resolve here.
[[tool]]
id = "gnu-bash"
name = "GNU Bash"
category = "shell"
cmd = "gnu-bash"
priority = "P2"
audience = "both"
tier = "system"
desc = "Modern GNU Bash (5.x) installed alongside macOS's SIP-protected system bash 3.2, never replacing it."
[[tool.method]]
kind = "brew"
formula = "bash"
os = ["macos"]
arch = ["arm64"]
detect_path = "/opt/homebrew/bin/bash"
[[tool.method]]
kind = "brew"
formula = "bash"
os = ["macos"]
arch = ["amd64"]
detect_path = "/usr/local/bin/bash"

