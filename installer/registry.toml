os = ["debian", "arch", "fedora"]
repo = "antonmedv/fx"
asset = "fx_linux_{arch.deb}"
member = "fx"
raw = true
[[tool.method]]
kind = "github_release"
os = ["macos"]
repo = "antonmedv/fx"
asset = "fx_darwin_{arch.deb}"
member = "fx"
raw = true
[[tool.method]]
kind = "brew"
formula = "fx"

