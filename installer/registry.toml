# Verified 2026-09-06 (Phase 9, REQ-codegraph-mcp-postinstall): codegraph's real
# `install --help` (v1.2.0) accepts `--target <ids>` (comma-separated real target ids
# -- claude, cursor, codex, opencode, hermes, gemini, antigravity, kiro -- NOT
# "cursor-agent", this project's own catalog id for that host), `--location
# global|local`, and `--yes` (non-interactive). `--target auto` is UNSAFE here:
# reading codegraph's own installer/targets/registry.js::resolveTargetFlag directly
# found it silently falls back to registering `claude` when it detects ZERO installed
# hosts. This postinstall hook (installer/postinstall.py::_codegraph_mcp_register)
# never passes "auto" -- it computes an explicit CSV via installer.status.is_installed
# on each of claude/codex/opencode/cursor-agent (mapping cursor-agent -> codegraph's own
# "cursor" id) and skips the `codegraph install` call entirely when none are present.
# `codegraph install` merges into each target's own config file rather than
# duplicating an entry, so re-running it is a safe no-op -- no separate "already
# registered" check is needed on this project's side. Per D-01 (09-CONTEXT.md), this
# fires ONLY from codegraph's own successful install and is never re-triggered by
# installing a NEW agent host afterward -- a known, accepted limitation. Also passes
# `--no-permissions`: codegraph's own `--yes` help text documents that flag as ALSO
# enabling a Claude Code auto-allow permissions list and a UserPromptSubmit hook, not
# merely non-interactivity -- `--no-permissions` (Claude-only, a no-op for other
# targets) keeps this call scoped to MCP registration only, matching
# REQ-codegraph-mcp-postinstall's literal wording (dual-lane review, codex-sol-high).
# Known, accepted limitation (dual-lane review, codex-sol-high): host detection uses
# the current process's live PATH via `is_installed`; a P0 agent host installed
# EARLIER IN THE SAME wizard run may not yet be on PATH (wiring happens in a later,
# separate `configure_path`/`make fix` step), so this hook could under-detect a
# same-run install. This matches REQ-codegraph-mcp-postinstall's own literal scope
# ("agent hosts already present" on the machine, not concurrently installed this
# run) and this codebase's existing `is_installed`/live-PATH detection convention
# used everywhere else -- not a regression this phase introduces.
postinstall = "codegraph-mcp-register"
[[tool.method]]
kind = "github_release"
os = ["macos"]
repo = "colbymchenry/codegraph"
asset = "codegraph-darwin-{arch.x64}.tar.gz"
checksum = "SHA256SUMS"
member = "bin/codegraph"
strip = 1
[[tool.method]]
kind = "github_release"
os = ["debian", "arch", "fedora"]
repo = "colbymchenry/codegraph"
asset = "codegraph-linux-{arch.x64}.tar.gz"
checksum = "SHA256SUMS"
member = "bin/codegraph"
strip = 1

