# tools-installer registry — single declarative source of truth.
# Each [[tool]] declares one or more [[tool.method]] entries. The resolver
# (installer/resolve.py) filters them to the platform and orders them by the
# priority ladder: script -> userspace download -> native pkg manager -> brew.

[[tool]]
id = "uv"
name = "uv"
category = "pkg-mgr"
cmd = "uv"
priority = "P0"
audience = "both"
desc = "Fast Python package and venv manager"
[[tool.method]]
kind = "script"
url = "https://astral.sh/uv/install.sh"
shell = "sh"
bin_dir = "~/.local/bin"
[[tool.method]]
kind = "brew"
formula = "uv"

[[tool]]
id = "rg"
name = "ripgrep"
category = "search"
cmd = "rg"
priority = "P0"
audience = "ai"
desc = "Fast recursive search; respects .gitignore"
[[tool.method]]
kind = "github_release"
repo = "BurntSushi/ripgrep"
asset = "ripgrep-{ver}-{arch.machine}-unknown-linux-musl.tar.gz"
member = "rg"
bin_dir = "~/.local/bin"
[[tool.method]]
kind = "dnf"
package = "ripgrep"
[[tool.method]]
kind = "apt"
package = "ripgrep"
[[tool.method]]
kind = "pacman"
package = "ripgrep"
[[tool.method]]
kind = "brew"
formula = "ripgrep"

[[tool]]
id = "jq"
name = "jq"
category = "data"
cmd = "jq"
priority = "P0"
audience = "ai"
desc = "Surgical queries and edits on JSON"
[[tool.method]]
kind = "dnf"
package = "jq"
[[tool.method]]
kind = "apt"
package = "jq"
[[tool.method]]
kind = "pacman"
package = "jq"
[[tool.method]]
kind = "brew"
formula = "jq"

[[tool]]
id = "brew"
name = "Homebrew"
category = "pkg-mgr"
cmd = "brew"
priority = "P1"
audience = "both"
desc = "The missing package manager (optional; some tools only live here)"
# bin_dir assumes Apple Silicon (/opt/homebrew/bin). Intel Macs use /usr/local/bin;
# arch-aware wiring is a deferred refinement, so PATH may be wrong on Intel.
[[tool.method]]
kind = "script"
os = ["macos"]
url = "https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh"
shell = "bash"
env = { NONINTERACTIVE = "1" }
bin_dir = "/opt/homebrew/bin"
[[tool.method]]
kind = "script"
os = ["debian", "arch", "fedora"]
url = "https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh"
shell = "bash"
env = { NONINTERACTIVE = "1" }
bin_dir = "/home/linuxbrew/.linuxbrew/bin"
