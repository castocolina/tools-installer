# Install-method decision (2026-09-05, this phase's research): mmdc stays on
# pnpm (`kind = "node"`). Homebrew is rejected because upstream mermaid-cli's
# own README states that install path is "no longer supported", and GitHub
# issue #1122 (closed "not planned") records a brew-installed mmdc failing at
# runtime with a chrome-headless-shell error because the formula declares only
# `node` as a dependency and does nothing about puppeteer or its browser. The
# formula's version currency (`brew info mermaid-cli` showed `11.17.0`, matching
# npm exactly on that date) was never the failure mode, so version parity is
# not an argument for brew here.
# Volta is rejected too, citing the finding already committed above the volta
# entry in this same file — `volta install` shells out to a real
# `npm install --global` with no flag that disables install scripts. Since
# `@mermaid-js/mermaid-cli` declares no preinstall/install/postinstall script
# of its own (verified via unpkg.com/@mermaid-js/mermaid-cli/package.json),
# Volta's unrestricted-scripts tradeoff buys nothing for mmdc while giving up
# pnpm's default-deny gate for puppeteer's postinstall, which is the one
# script in this pair that matters.
# Four criteria: stability — brew is a reproducing breakage, not a risk;
# security — pnpm's scoped `--allow-build=puppeteer` versus Volta's blanket
# unrestricted execution; simplicity — no migration, mmdc is already
# `kind="node"`; maintainability — one manager owns mmdc and its peer, so the
# pair can share a single pnpm install group.
# Why `co_install`/`allow_build`/`versions` are on this method:
# `@mermaid-js/mermaid-cli` declares puppeteer as a peerDependency
# (`^23 || ^24 || ^25`), so it is deliberately not auto-installed; and pnpm's
# Global Packages documentation states that packages installed in separate
# invocations get isolated `node_modules` trees and only a comma-separated
# group resolves peer dependencies against each other. `requires` alone would
# order the install correctly and still leave mmdc unable to load puppeteer.
# The `^25` pin exists because npm's current `latest` is already 25.10.0, at
# the top of that peer range; it is a compatibility control on the argv this
# project generates, not a limit on pnpm's persistent build allowance.
# Brownfield: a machine that already has a standalone mmdc never runs the
# grouped invocation. `installer/engine.py::install_tool` returns
# ALREADY_INSTALLED before `resolve_methods` is ever consulted, and
# `installer/deps.py` drops already-installed tools out of the returned order,
# so the catalog installs only puppeteer and leaves the two packages in
# separate isolated groups. Plan 05-01's Tier-3 container measured
# BROWNFIELD_BEFORE=ok on pnpm 12.3.4 with default autoInstallPeers (render
# succeeded after standalone mmdc + standalone allow-build puppeteer), while
# SPLIT vs GROUPED path hashes still differed. Remedy: the Doctor's
# pnpm-globals reinstall action (`r`), which after plan 05-04 replays the live
# global set as one comma-joined, build-allowed group and repairs the split;
# the same container run proved that remedy renders successfully afterwards.
# TWO brownfield shapes, not one, and `r` repairs both:
#  - SPLIT: both packages are globals in separate isolated installs. This is
#    the shape a post-phase-5 catalog run creates on a machine that already
#    had a standalone mmdc.
#  - INCOMPLETE: mmdc is a global and puppeteer is not a global at ALL. This
#    is every machine that installed mmdc from this catalog BEFORE phase 5,
#    and it is the shape that matters most, because `~/.cache/puppeteer` is
#    empty and mmdc fails at render time. `split_install_groups` cannot see it
#    (a split needs two present members), so
#    `installer/pnpm_globals.py::incomplete_install_groups` reports it, and the
#    replay completes the declared group rather than putting back only the
#    names pnpm already listed.
# Manual alternative: `pnpm remove -g @mermaid-js/mermaid-cli` followed by a
# catalog install of mmdc. Automatic repair at INSTALL time — reconciling
# group membership before install_tool's ALREADY_INSTALLED short-circuit — is
# out of scope: that short-circuit is the installer's single "is it already
# there?" rule for every tool and every method kind, and making it
# manager-aware for one pnpm pair puts a second availability rule in the
# engine. The Doctor is where an already-installed machine's state is audited,
# so detection and repair belong there.
# Doctor group detection: the TUI Doctor reports a split group AND an
# incomplete one as separate warnings, each naming the packages involved and
# pointing at the `r` reinstall action.
# Group coupling: pnpm's Global Packages documentation states that packages in
# one comma group "are removed together" and that removing either member with
# `pnpm remove -g` removes the WHOLE group. So a user who removes puppeteer by
# hand also removes mmdc, and vice versa. `installer/uninstall.py` classifies
# node tools as externally managed and non-selectable, so this installer never
# performs that removal itself; the coupling is recorded here because it
# changes what `_managed_hint` is telling the user and is the first thing a
# future uninstall or Doctor-UX phase needs to know.
[[tool]]
id = "mmdc"
name = "Mermaid CLI"
category = "diagram"
cmd = "mmdc"
priority = "P2"
audience = "both"
tier = "user"
desc = "Render Mermaid diagrams to SVG/PNG/PDF from the command line"
requires = ["pnpm", "puppeteer"]
[[tool.method]]
kind = "node"
npm_pkg = "@mermaid-js/mermaid-cli"
co_install = ["puppeteer"]
allow_build = ["puppeteer"]
min_node = "22.12.0"
smoke = "puppeteer-browser"
versions = { puppeteer = "^25" }

# Verified 2026-09-05: puppeteer declares `postinstall = "node install.mjs"`,
# which downloads Chrome for Testing and chrome-headless-shell into
# `~/.cache/puppeteer`. pnpm blocks that script by default and reports it as a
# warning rather than an error, so `allow_build = ["puppeteer"]` on these
# methods is what makes the browser actually arrive. Without it the install
# reports success and the tool is broken.
# The `--allow-build` grant is PERSISTENT and PACKAGE-LEVEL, not
# per-invocation: pnpm's own `add` documentation records that the flag also
# writes the package into pnpm's build allowance configuration, so that
# package "will always be allowed to run its scripts in the future" on this
# machine — including versions this installer never installs, from commands
# this project never issues. `versions = { puppeteer = "^25" }` does not bound
# that grant. The pin constrains only the commands this project generates, so
# it keeps mmdc and puppeteer inside a working peer range and authorises
# nothing. What does bound the grant: it names exactly one package and plan
# 05-01's load-time rule forbids an allowance for any package outside the
# invocation's own install group, so it can never become a blanket allowance;
# the Doctor's reinstall replay emits it only for a member of a declared group
# it is actually forming — a live `puppeteer` with no `@mermaid-js/mermaid-cli`
# beside it is the hand-install shape, and the replay grants it nothing, so
# pressing `r` to repair other globals cannot create this grant on a machine
# that never had it (installer/pnpm_globals.py::_formed_groups);
# it does nothing until that package is installed again; the npm registry's own
# record for this package name was checked for consistency with the canonical
# upstream project before it was created (plan 05-03 Task 1 — a
# metadata-consistency check on publisher-controlled fields, NOT proof of
# publisher identity or artifact provenance, so it refutes a typosquat or a
# freshly published look-alike and says nothing about a takeover of the
# established name); and it is revocable. Revocation: remove the package's
# entry from pnpm's build-allowance configuration (plan 05-01 recorded the
# file as `/root/.local/share/pnpm/global/v11/pnpm-workspace.yaml` with
# `allowBuilds: puppeteer: true`; on a user machine it is the same
# `pnpm-workspace.yaml` under the global store). Removing that entry re-gates
# the package.
# chrome-headless-shell needs no entry of its own: it arrives with that same
# postinstall, and it has no independent install path to model.
# Linux-only prerequisite: the downloaded Chrome links against roughly thirty
# system shared libraries that a minimal Linux install does not ship
# (puppeteer's own troubleshooting documentation publishes an exact Debian
# list). macOS needs no equivalent step — the frameworks are part of the OS.
# This is recorded rather than automated: the exact Fedora and Arch package
# names are not published by any authoritative source, and guessing a
# translated list is precisely what this project's registry-authoring
# discipline exists to prevent. The Tier-3 container verification for this
# phase provisioned the libraries by installing the distro `chromium` package,
# which pulls them transitively and by correct name.
# Linux arm64: puppeteer's own troubleshooting documentation states Chrome
# publishes no Linux arm64 binary, so the browser puppeteer downloads by
# default cannot run there at all. This is NOT a caveat — it is why the Linux
# method declares `arch = ["amd64"]`. The entry resolves no method on Linux
# arm64, so `installer/deps.py` skips both puppeteer and mmdc there with a
# dependency-unavailable warning instead of reporting a successful install of
# a tool that cannot render. Documented workaround for a user who has a
# distro-provided browser: point puppeteer at it via PUPPETEER_EXECUTABLE_PATH.
# Supporting that path is out of this phase's scope.
# `min_node = "22.12.0"` is puppeteer 25's own `engines.node` floor, and plan
# 05-01's executor preflight refuses the install below it rather than letting
# the postinstall fail obscurely.
# `smoke = "puppeteer-browser"` is the post-install check plan 05-01 Task 4
# ships: after `pnpm add -g` returns, the installer runs a bounded node script
# that calls puppeteer's own `launch()`, opens a blank page and closes the
# browser, and fails the install when that does not work. A package manager's
# exit code proves a download succeeded, not that the thing downloaded can run,
# and on Linux amd64 those two facts genuinely come apart when the system
# shared libraries above are missing.
# WHICH browser is puppeteer's decision, not this project's: `launch()`
# resolves PUPPETEER_EXECUTABLE_PATH, the cache directory puppeteer itself
# resolves and the build it would pick, so the thing started is the thing mmdc
# will start. The check that shipped first instead globbed `~/.cache/puppeteer`
# and ran `<binary> --version`, which proved neither — `--version` exits before
# browser startup, sandbox initialisation, profile creation and the DevTools
# connection, so any executable that printed something passed.
# The check starts a browser and opens a blank page; it renders no diagram.
# When it runs, and the gap that leaves: on the INSTALL path it fires exactly
# once, after `pnpm add -g` has already returned — the packages stay installed
# and the bin shim stays on PATH, so `installer/status.py::is_installed` (PATH
# presence) makes `installer/engine.py::install_tool` return ALREADY_INSTALLED
# on every later run and the executor is never reached again. A browser that
# stops starting later (an OS update removing one of the shared libraries
# above) would therefore have been reported as installed forever. The Doctor
# closes that: `installer/pnpm_globals.py::audit_node_globals` re-runs this
# check for every catalog tool pnpm still manages and reports a failure as a
# WARN. Residual, accepted: the re-check lives on the Doctor, not in
# `is_installed` — that function answers "is it here?" for every tool of every
# kind on every catalog render, and spawning a browser to answer it would stop
# it describing availability at all. So re-running the INSTALL alone still
# short-circuits; the Doctor is the surface that re-asks.
# Installed twice by construction on a clean path (standalone puppeteer, then
# again inside mmdc's comma group). Plan 05-01's Tier-3 tracer measured ONE
# group afterwards: invocation B absorbed invocation A's standalone install
# (both packages shared path hash `1525-...`; A's standalone hash was gone),
# CACHE_BEFORE_B and CACHE_AFTER_B were both 652M with the same chrome /
# chrome-headless-shell `linux-152.0.7977.75` listings, and the puppeteer shim
# on PATH is `$PNPM_HOME/bin/puppeteer` from the grouped project. No
# redundancy exists on this pnpm. Disposition: closed; do not re-open.
# Linux arm64 limit of the gate: `installer/deps.py::is_blocked` treats any
# tool `is_installed()` reports as satisfied, so on a Linux arm64 machine that
# ALREADY has a standalone mmdc the skip warning is not emitted — the arm64
# honesty guarantee holds for clean machines, and a pre-existing install is
# left alone rather than re-reported.
[[tool]]
id = "puppeteer"
name = "Puppeteer"
category = "dev"
cmd = "puppeteer"
priority = "P3"
audience = "both"
tier = "user"
desc = "Headless-Chrome automation library; downloads its own Chrome and chrome-headless-shell. Required at runtime by mmdc."
requires = ["pnpm"]
[[tool.method]]
kind = "node"
os = ["macos"]
npm_pkg = "puppeteer"
allow_build = ["puppeteer"]
versions = { puppeteer = "^25" }
min_node = "22.12.0"
smoke = "puppeteer-browser"
[[tool.method]]
kind = "node"
os = ["debian", "arch", "fedora"]
arch = ["amd64"]
npm_pkg = "puppeteer"
allow_build = ["puppeteer"]
versions = { puppeteer = "^25" }
min_node = "22.12.0"
smoke = "puppeteer-browser"

# Verified 2026-09-06: confirmed live via formulae.brew.sh/api/cask/kitty.json
# (cask token kitty, version 0.48.2) and formulae.brew.sh/api/formula/kitty.json
# (404 — no Linux/macOS formula exists, cask-only); kitty is natively packaged
# as kitty on Debian, Fedora, and Arch. Correcting a stale claim
# (07-RESEARCH.md's Anti-Patterns: "there is no Linux Homebrew path for either"
# kitty/wezterm): re-fetching formulae.brew.sh/api/cask/kitty.json this session
# shows the kitty cask's variations object DOES declare real
# x86_64_linux/arm64_linux artifacts upstream — "no Linux cask exists" is false
# for kitty specifically (true for wezterm below, whose cask has an empty
# variations object and macOS-only depends_on). The REAL reason kitty's Linux
# path here is native distro packages, not kind="cask": this project's own
# installer/resolve.py::_applies's cask branch is hardcoded
# `platform.os == "macos" and platform.has_brew`, unconditionally excluding
# every cask-kind method on any non-macOS platform regardless of what Homebrew
# ships upstream — a generic, tool-agnostic project policy, not an absence of
# upstream Linux packaging.
# Accepted Bazzite gap: kitty's GitHub release Linux assets
# (kitty-{ver}-{arch}.txz, confirmed via
# api.github.com/repos/kovidgoyal/kitty/releases/latest this session) are
# XZ-compressed (.txz), but installer/download.py's extraction
# (_install_unverified/_place_verified, lines 146 and 207) hardcodes
# `tar -xzf` (gzip-only) — a github_release method for kitty on Linux would
# fail at extraction time. No native manager runs on immutable Bazzite by
# design (installer/resolve.py::_applies's existing immutable-Linux skip), so
# kitty genuinely has NO applicable method on immutable Bazzite. No
# resolver-applicable Linux fallback: the formula is absent (404, confirmed
# above), and project policy excludes casks on Linux (_applies's cask branch,
# confirmed above) — two independent facts, neither implying the other.
# REQ-linux-bazzite-shell-parity names only zsh/oh-my-zsh, so this gap
# violates no locked requirement; fixing download.py's archive extraction
# (e.g. `tar -xzf` -> `tar -xf`, which auto-detects compression) is out of
# this registry-only phase's scope — flag for a future phase if ever
# revisited, do not silently attempt it here.
# Dual-lane code review (codex-sol-high) found the cask method missing a
# macOS-version floor: formulae.brew.sh/api/cask/kitty.json declares
# depends_on.macos >= 12. min_os_version = "12" below closes it, reusing
# the same gate Apple Containers uses.
[[tool]]
id = "kitty"
name = "kitty"
category = "terminal"
cmd = "kitty"
priority = "P3"
audience = "human"
tier = "user"
desc = "GPU-accelerated terminal emulator"
[[tool.method]]
kind = "dnf"
package = "kitty"
[[tool.method]]
kind = "apt"
package = "kitty"
[[tool.method]]
kind = "pacman"
package = "kitty"
[[tool.method]]
kind = "cask"
os = ["macos"]
cask = "kitty"
app = "kitty.app"
min_os_version = "12"

# Verified 2026-09-06: confirmed live via formulae.brew.sh/api/cask/wezterm.json
# (cask token wezterm, version 20240203-110809,5046fc22) and
# formulae.brew.sh/api/formula/wezterm.json (404 — cask-only, same as kitty).
# Linux story per-distro, verified live via
# api.github.com/repos/wezterm/wezterm/releases/latest this session: Arch has
# wezterm natively packaged in the official [extra] repo (plain
# `pacman -S wezterm` works, no custom repo needed) — no fallback method is
# declared for it; Debian/Fedora have no plain native package (Debian needs
# WezTerm's own apt repo added, Fedora needs `dnf copr enable wez/wezterm` —
# neither is a stock package-manager install this project can automate
# without adding an untrusted third-party repo, a worse trust posture than a
# checksum-verified GitHub release), so those two use the github_release
# AppImage instead. Checksum finding: the release publishes
# WezTerm-{tag}-Ubuntu20.04.AppImage.sha256 as a sibling asset, and its
# content (fetched and read this session) is the multi-line
# `<hash>  <filename>` format
# (34010a07...  WezTerm-20240203-110809-5046fc22-Ubuntu20.04.AppImage), which
# installer/checksums.py::expected_sha256's existing _names_match branch
# already parses correctly — checksum = "{asset}.sha256" needs no new code.
# Linux-arm64 scope, resolved via a live check this session
# (api.github.com/repos/wezterm/wezterm/releases/latest): the only Linux
# arm64 assets published are .deb variants
# (wezterm-*.Debian12.arm64.deb, wezterm-*.Ubuntu22.04.arm64.deb) — no arm64
# AppImage exists, so `arch = ["amd64"]` is kept on the github_release method
# below. Arch Linux arm64 is ALREADY covered by this entry's OWN pacman
# method (undeclared arch, so it applies on every Arch architecture,
# including arm64 — installer/resolve.py::_applies's arch filter is a no-op
# when a method declares no arch list); only Debian/Fedora arm64 lack a path,
# a gap bounded by upstream asset availability (outside this project's
# control), not a project scoping choice — see puppeteer's existing
# Linux-arm64 gate above for this registry's precedent on the reasoning
# shape. Unplanned Bazzite bonus: unlike kitty, this AppImage method DOES
# resolve on immutable Fedora (Bazzite) — installer/resolve.py::_applies's
# immutable-Linux skip applies only to native package-manager kinds
# (dnf/apt/pacman), never to github_release, and raw=true means
# _install_unverified/_place_verified never reach the tar -xzf call that
# breaks on kitty's .txz assets — wezterm gets a real Linux/Bazzite path as a
# side effect of this design choice, though REQ-linux-bazzite-shell-parity
# does not require it.
[[tool]]
id = "wezterm"
name = "WezTerm"
category = "terminal"
cmd = "wezterm"
priority = "P3"
audience = "human"
tier = "user"
desc = "GPU-accelerated, cross-platform terminal emulator with multiplexing"
[[tool.method]]
kind = "pacman"
package = "wezterm"
[[tool.method]]
kind = "github_release"
os = ["debian", "fedora"]
arch = ["amd64"]
repo = "wezterm/wezterm"
asset = "WezTerm-{ver}-Ubuntu20.04.AppImage"
checksum = "{asset}.sha256"
member = "wezterm"
raw = true
[[tool.method]]
kind = "cask"
os = ["macos"]
cask = "wezterm"
app = "WezTerm.app"

