# Verified 2026-09-06: confirmed live via api.github.com/repos/rtk-ai/rtk/
# releases/latest (tag v0.48.0 at research time) and by downloading and
# reading checksums.txt directly -- the standard multi-line <hash>  <filename>
# format this project's installer/checksums.py already parses, listing every
# published asset. Upstream publishes a musl (static) build for amd64
# (rtk-x86_64-unknown-linux-musl.tar.gz) but a gnu (dynamically-linked) build
# for arm64 (rtk-aarch64-unknown-linux-gnu.tar.gz) -- a single unscoped asset
# template would 404 on one architecture, hence two arch-gated Linux
# methods. Each Linux tarball's top level is a bare rtk binary with no
# wrapping directory (confirmed by downloading and running tar -tzf on all
# three tarballs this session -- x86_64-musl, aarch64-gnu, and
# x86_64-apple-darwin), hence member = "rtk", strip = 0 on every method.
# The macOS method has no arch restriction (it also serves aarch64-apple-darwin,
# the Apple Silicon build), but that specific tarball was NOT independently
# downloaded/inspected -- assumed to share the same flat-binary layout as the
# other three verified assets, based on rtk-ai's single cross-compiled release
# pipeline (cross-AI dual-lane review, WR-01). No {ver} placeholder is needed
# in the asset names (upstream's own
# convention omits it). The default branch is develop, not main --
# informational only, since this project's own tag resolution always uses
# the GitHub Releases API's "latest" endpoint, never a branch checkout. A
# genuine Homebrew formula rtk (bare name, homebrew-core) was confirmed live
# via formulae.brew.sh/api/formula/rtk.json to be the SAME upstream project
# -- matching homepage, description, and the exact version 0.48.0, not a
# name collision -- added here as a fallback AFTER the locked
# github_release method, per this registry's dominant convention; it does
# not replace REQ-rtk-github-release's checksum-verified mandate.
[[tool]]
id = "rtk"
name = "RTK (Rust Token Killer)"
category = "dev"
cmd = "rtk"
priority = "P1"
audience = "ai"
tier = "ai"
desc = "CLI proxy that rewrites/compresses common dev-command output to cut LLM-visible token usage 60-90%."
postinstall = "rtk-register"
# Verified 2026-09-11: rtk v0.49.0's `claude` host registration
# (`rtk init -g --auto-patch`) live-tested against a freshly downloaded,
# checksum-verified binary in an isolated scratch $HOME -- confirmed
# idempotent on rerun and merge-safe against pre-existing permissions/hooks/
# statusLine content. See 12.4-01-SUMMARY.md for the full transcript.
# Verified 2026-09-11: `opencode`/`codex` host registration live-tested
# against the same v0.49.0 binary; `codex` never receives --auto-patch
# (rejected outright: "--codex cannot be combined with --auto-patch").
# `cursor-agent`'s `--agent cursor` mode STILL unconditionally also writes
# Claude Code's RTK.md/settings.json as a side effect in v0.49.0 (unchanged
# from the stale v0.44.1 research finding) -- installer/postinstall.py's
# _rtk_register only fires the cursor-agent branch when `claude` is ALSO
# present, to avoid writing unrequested Claude Code scaffolding on a
# Cursor-only machine. See 12.4-01-SUMMARY.md for the full transcript.
[[tool.method]]
kind = "github_release"
os = ["macos"]
repo = "rtk-ai/rtk"
asset = "rtk-{arch.machine}-apple-darwin.tar.gz"
checksum = "checksums.txt"
member = "rtk"
strip = 0
[[tool.method]]
kind = "github_release"
os = ["debian", "arch", "fedora"]
arch = ["amd64"]
repo = "rtk-ai/rtk"
asset = "rtk-{arch.machine}-unknown-linux-musl.tar.gz"
checksum = "checksums.txt"
member = "rtk"
strip = 0
[[tool.method]]
kind = "github_release"
os = ["debian", "arch", "fedora"]
arch = ["arm64"]
repo = "rtk-ai/rtk"
asset = "rtk-{arch.machine}-unknown-linux-gnu.tar.gz"
checksum = "checksums.txt"
member = "rtk"
strip = 0
[[tool.method]]
kind = "brew"
formula = "rtk"

