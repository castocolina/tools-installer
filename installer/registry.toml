strip = 1
[[tool.method]]
kind = "github_release"
os = ["macos"]
repo = "sharkdp/fd"
asset = "fd-v{ver}-{arch.machine}-apple-darwin.tar.gz"
member = "fd"
strip = 1
[[tool.method]]
kind = "brew"
