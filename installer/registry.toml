id = "softaworks-agent-toolkit"
name = "Softaworks Agent Toolkit"
category = "ai"
cmd = "softaworks-agent-toolkit"
priority = "P3"
audience = "human"
desc = "Selected host-aware agent skills installed by the official skills CLI; uninstall with npx skills remove."
tier = "ai"
[[tool.method]]
kind = "skill_pack"
[tool.skill_lifecycle]
source = "https://github.com/softaworks/agent-toolkit"
owner = "softaworks"
supported_harnesses = ["claude", "codex", "cursor"]
revision_policy = "upstream-latest"
targets = [
  { scope = "global", path = "~/.agents/skills/<selected-skill>" },
  { scope = "harness", path = "<selected-harness-skill-dir>/<selected-skill>" },
]
[tool.skill_lifecycle.install]
mode = "manual-required"
instructions = [
  "After leaving the installer, select each skill and target harness through the official skills CLI:",
  "npx skills add https://github.com/softaworks/agent-toolkit --skill <name>",
]
[tool.skill_lifecycle.status]
mode = "manual-required"
instructions = [
  "Run npx skills list in a console and verify each selected skill and harness; status stays unknown here because npx may acquire the skills CLI.",
]
[tool.skill_lifecycle.update]
mode = "manual-required"
instructions = [
  "Review upstream changes, then update each selected installed skill through the official CLI:",
  "npx skills update <selected-skill>",
]
[tool.skill_lifecycle.removal]
mode = "manual-required"
instructions = [
  "Select the installed skill and affected harnesses through the official removal flow:",
  "npx skills remove <selected-skill>",
]



