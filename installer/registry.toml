[[tool.method]]
kind = "github_release"
os = ["macos"]
repo = "sharkdp/bat"
asset = "bat-v{ver}-{arch.machine}-apple-darwin.tar.gz"
member = "bat"
strip = 1
[[tool.method]]
kind = "brew"
