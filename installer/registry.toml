[[tool]]
id = "sd"
name = "sd"
category = "text"
cmd = "sd"
priority = "P2"
audience = "both"
desc = "Intuitive find-and-replace (sed alternative)"
[[tool.method]]
kind = "github_release"
os = ["debian", "arch", "fedora"]
repo = "chmln/sd"
asset = "sd-v{ver}-{arch.machine}-unknown-linux-musl.tar.gz"
member = "sd"
strip = 1
[[tool.method]]
kind = "github_release"
os = ["macos"]
repo = "chmln/sd"
