[[tool]]
id = "delta"
name = "delta"
category = "git"
cmd = "delta"
priority = "P2"
audience = "both"
desc = "A syntax-highlighting pager for git, diff, and grep output"
[[tool.method]]
kind = "github_release"
os = ["debian", "arch", "fedora"]
repo = "dandavison/delta"
# delta publishes no musl build, so gnu is the only Linux binary (unlike fd/bat/sd).
asset = "delta-{ver}-{arch.machine}-unknown-linux-gnu.tar.gz"
member = "delta"
strip = 1
[[tool.method]]
kind = "github_release"
os = ["macos"]
repo = "dandavison/delta"
asset = "delta-{ver}-{arch.machine}-apple-darwin.tar.gz"
member = "delta"
strip = 1
[[tool.method]]
kind = "brew"
formula = "git-delta"
