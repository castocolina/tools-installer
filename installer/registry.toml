# layout.
# There is no Homebrew formula for this tool as of that date, so github_release
# is the only rung on this ladder: a checksum mismatch or a network failure
# has no fallback method, unlike every other download-kind entry in this file
# that pairs with brew. A checksum mismatch deliberately halts the ladder
# rather than falling through (installer/engine.py's checksum_policy="fail"
# default), so on this entry a mismatch is terminal by design.
# Re-verify the asset names and the SHA256SUMS presence if this entry is
# revisited after 2026-10-05, since the asset naming is upstream's
# release-workflow convention rather than a published contract.
