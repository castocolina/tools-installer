repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run bandit -q -r installer --skip B404,B603,B310
        language: system
        pass_filenames: false
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        pass_filenames: false
      # Same file set as `make validate`, so a commit cannot pass what the gate rejects.
      - id: shellcheck
        name: shellcheck
        entry: uv run shellcheck -x install.sh scripts/lib/prune-tmp-common.sh scripts/prune-tmp-linux.sh scripts/prune-user-tmpdir.sh
        language: system
        pass_filenames: false
        types: [shell]
