# Each gate's command lives once, in its Makefile target. The commit stage runs the six static
# gates; the push stage runs them again, then `make test`. `make validate` runs the commit stage
# through pre-commit. `pre-commit install` writes only the commit hook.
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: make lint
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: ruff-format
        name: make format-check
        entry: make format-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: pyright
        name: make typecheck
        entry: make typecheck
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: bandit
        name: make security
        entry: make security
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: vulture
        name: make dead-code
        entry: make dead-code
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: shellcheck
        name: make shellcheck
        entry: make shellcheck
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: tests
        name: make test
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
