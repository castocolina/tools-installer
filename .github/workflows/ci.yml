name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save free-tier minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: validate & test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: make install
      - name: Validate
        run: make validate
      - name: Test
        # Below the job's 25: a stalled run fails this step and keeps its log.
        # The macOS runner needed ~12 min for ~6000 tests and timed out at 96% three times.
        timeout-minutes: 20
        # A dedicated runner needs no host headroom: use every CPU, not the 40% local cap
        # (macos-latest has 3, which the cap turned into a single worker).
        run: PYTEST_XDIST_AUTO_NUM_WORKERS="$(python3 -c 'import os; print(os.cpu_count() or 1)')" make test
