# Hosts: Claude Code, Antigravity, Codex App/CLI (one id), Cursor, Devin CLI,
# Factory Droid, Gemini CLI, Copilot CLI, Grok Build, Kimi Code, OpenCode, Pi,
# Qwen Code, Hermes Agent, Muse. Codex App is GUI-only (Plugins sidebar); the
# CLI commands are the by_harness lines. No requires: a multi-host pack must
# not force-install one host. Probes only for claude/codex/pi plugin-cli.
