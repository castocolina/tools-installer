[[tool]]
id = "opengsd"
name = "OpenGSD"
category = "ai"
cmd = "opengsd"
priority = "P3"
audience = "human"
desc = "Guided cross-runtime workflow installer; uninstall with its runtime, scope, and --uninstall flags."
tier = "ai"
verified = 2026-10-10
[[tool.method]]
kind = "skill_pack"
# Verified 2026-10-10: https://github.com/open-gsd/gsd-core/blob/main/README.md
# Named hosts only. "and more" is not expanded. install-state match is gsd-core.
[tool.skill_lifecycle]
source = "https://github.com/open-gsd/gsd-core"
owner = "open-gsd"
supported_harnesses = [
  "antigravity",
  "claude",
  "codex",
  "copilot",
  "cursor",
  "kilo",
  "kimi",
  "opencode",
  "windsurf",
]
status_probes = [
  { harness = "antigravity", via = "install-state", match = "gsd-core" },
  { harness = "claude", via = "install-state", match = "gsd-core" },
  { harness = "codex", via = "install-state", match = "gsd-core" },
  { harness = "copilot", via = "install-state", match = "gsd-core" },
  { harness = "cursor", via = "install-state", match = "gsd-core" },
  { harness = "kilo", via = "install-state", match = "gsd-core" },
  { harness = "kimi", via = "install-state", match = "gsd-core" },
  { harness = "opencode", via = "install-state", match = "gsd-core" },
  { harness = "windsurf", via = "install-state", match = "gsd-core" },
]
revision_policy = "package-manager-latest"
# D-21: framework packs install per repo; the pin is the version verified on 2026-10-15.
scope = "project"
version = "1.16.0"
targets = [
  { scope = "project", path = "<project>/<selected-runtime-dir>" },
]
[tool.skill_lifecycle.install]
mode = "manual-required"
instructions = [
  "This pack is project-local: install it per repository, never as a global install (Node >= 24 per npm engines).",
  "After leaving the installer, in each repository that has a .planning/ directory, run once per runtime used there:",
  "pnpm dlx @opengsd/gsd-core@1.16.0 --<runtime> --local --relative-includes",
  "Do not copy files from the repository.",
]
[tool.skill_lifecycle.status]
mode = "manual-required"
instructions = [
  "Use the OpenGSD installer for the selected runtime and scope to verify its managed installation; a generated-file guess is not authoritative.",
]
[tool.skill_lifecycle.update]
mode = "manual-required"
instructions = [
  "In each repository, re-run the same pinned command; a new upstream version arrives by bumping the registry pin:",
  "pnpm dlx @opengsd/gsd-core@1.16.0 --<runtime> --local --relative-includes",
]
[tool.skill_lifecycle.removal]
mode = "manual-required"
instructions = [
  "Remove a leftover global install with: pnpm dlx @opengsd/gsd-core@1.16.0 --<runtime> --global --uninstall",
  "In each repository, remove the per-repository install with:",
  "pnpm dlx @opengsd/gsd-core@1.16.0 --<runtime> --local --uninstall",
]



