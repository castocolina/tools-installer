[[tool.method]]
kind = "skill_pack"
# Verified 2026-10-10: https://github.com/Fission-AI/OpenSpec/blob/main/docs/supported-tools.md
# Hosts are that page's tool table, mapped onto SKILL_HARNESSES ids. The shared
# `.agents` target is not a host. windsurf is an alias of devin there, so it is
# not listed separately. Global detection cannot prove project initialization.
[tool.skill_lifecycle]
source = "https://github.com/Fission-AI/OpenSpec"
owner = "Fission-AI"
supported_harnesses = [
  "amazon-q",
  "antigravity",
  "auggie",
  "bob",
  "claude",
  "cline",
  "codeartsagent",
  "codeassistant",
  "codebuddy",
  "codex",
  "command-code",
  "continue",
  "copilot",
  "costrict",
  "crush",
  "cursor",
  "devin",
  "factory-droid",
  "forgecode",
  "gemini-cli",
  "hermes",
  "iflow",
  "junie",
  "kilo",
  "kimi",
  "kiro",
  "lingma",
  "minimax-code",
  "oh-my-pi",
  "opencode",
  "pi",
  "qoder",
  "qwen",
  "roocode",
  "rovodev",
  "trae",
  "vibe",
  "zcode",
  "zed",
]
revision_policy = "package-manager-latest"
targets = [
  { scope = "global", path = "<pnpm-global-dir>/@fission-ai/openspec" },
  { scope = "project", path = "<project>/openspec" },
  { scope = "project", path = "<project>/<selected-agent-dir>" },
]
approval_disclosures = [
  "Affected agent hosts: those selected during openspec init.",
  "Generated files: openspec/specs/, openspec/changes/, openspec/config.yaml, and selected agent skill or command directories.",
  "Anonymous telemetry sends command names and version only. Set OPENSPEC_TELEMETRY=0 or DO_NOT_TRACK=1 to opt out.",
]
[tool.skill_lifecycle.install]
mode = "manual-required"
instructions = [
  "After leaving the installer, set PROJECT_DIR to an absolute, user-approved project directory, then run:",
  "PROJECT_DIR=/absolute/path/to/project",
  "pnpm add -g @fission-ai/openspec@latest",
  "cd \"$PROJECT_DIR\" && openspec init",
]
[tool.skill_lifecycle.status]
mode = "manual-required"
instructions = [
  "In the target project, review the openspec/ tree and the selected agent directories; a global openspec binary alone does not prove project initialization.",
]
[tool.skill_lifecycle.update]
mode = "manual-required"
instructions = [
  "Set PROJECT_DIR to the initialized project and review local changes before running:",
  "cd \"$PROJECT_DIR\" && openspec update",
]
[tool.skill_lifecycle.removal]
mode = "manual-required"
instructions = [
  "Review and manually remove OpenSpec-generated project and selected-agent files in each initialized project.",
  "pnpm remove -g @fission-ai/openspec",
]



[[tool]]
id = "superpowers"
name = "Superpowers"
category = "ai"
cmd = "superpowers"
priority = "P3"
