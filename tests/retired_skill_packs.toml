source = "https://github.com/obra/superpowers"
owner = "obra"
supported_harnesses = [
  "antigravity",
  "claude",
  "codex",
  "copilot",
  "cursor",
  "devin",
  "factory-droid",
  "gemini-cli",
  "grok",
  "hermes",
  "kimi",
  "muse",
  "opencode",
  "pi",
  "qwen",
]
revision_policy = "upstream-default-branch"
targets = [{ scope = "harness", path = "<host-plugin-dir>/superpowers" }]
status_probes = [
  { harness = "claude", via = "plugin-cli", match = "superpowers@claude-plugins-official" },
  { harness = "codex", via = "plugin-cli", match = "superpowers" },
  { harness = "pi", via = "plugin-cli", match = "obra/superpowers" },
]
[tool.skill_lifecycle.install]
mode = "manual-required"
instructions = [
  "After leaving the installer, run the official command for a host this machine has.",
  "pi install git:github.com/obra/superpowers",
]
[tool.skill_lifecycle.install.by_harness]
antigravity = ["agy plugin install https://github.com/obra/superpowers"]
claude = [
  "/plugin install superpowers@claude-plugins-official",
]
codex = ["/plugins (opens the plugin browser; search for superpowers and install it)"]
copilot = [
  "copilot plugin marketplace add obra/superpowers-marketplace",
  "copilot plugin install superpowers@superpowers-marketplace",
]
cursor = ["/add-plugin superpowers"]
devin = ["devin plugins install obra/superpowers"]
factory-droid = [
  "droid plugin marketplace add https://github.com/obra/superpowers",
  "droid plugin install superpowers@superpowers",
]
gemini-cli = ["gemini extensions install https://github.com/obra/superpowers"]
grok = ["grok plugin install superpowers@xai-official --trust"]
hermes = ["hermes plugins install obra/superpowers --enable"]
kimi = ["/plugins install https://github.com/obra/superpowers"]
muse = [
  "git clone https://github.com/obra/superpowers.git",
  "muse plugins install ./superpowers",
  "muse plugins approve superpowers",
]
opencode = [
  "Fetch and follow instructions from https://raw.githubusercontent.com/obra/superpowers/refs/heads/main/.opencode/INSTALL.md",
]
pi = ["pi install git:github.com/obra/superpowers"]
qwen = ["qwen extensions install obra/superpowers"]
[tool.skill_lifecycle.status]
mode = "manual-required"
instructions = [
  "Run `pi list` and look for obra/superpowers.",
]
[tool.skill_lifecycle.update]
mode = "manual-required"
instructions = [
  "Use Pi's package manager to review and update the obra/superpowers package from its upstream default branch.",
]
[tool.skill_lifecycle.removal]
mode = "manual-required"
instructions = [
  "After leaving the installer, remove the package through Pi:",
  "pi uninstall git:github.com/obra/superpowers",
]



