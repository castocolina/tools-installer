[[tool]]
id = "ponytail"
name = "Ponytail"
category = "ai"
cmd = "ponytail"
priority = "P3"
audience = "human"
desc = "Codex plugin whose lifecycle hooks require review; uninstall through Codex."
tier = "ai"
verified = 2026-10-10
[[tool.method]]
kind = "skill_pack"
# Verified 2026-10-10: https://github.com/DietrichGebert/ponytail/blob/main/INSTALL.md
# README names Claude Code and Codex. INSTALL.md names the other hosts below.
# The "copy AGENTS.md if not listed" catch-all is not expanded. Probes are
# plugin-cli for claude and codex only; other hosts have no closed list source.
[tool.skill_lifecycle]
source = "https://github.com/DietrichGebert/ponytail"
owner = "DietrichGebert"
supported_harnesses = [
  "aider",
  "amp",
  "antigravity",
  "claude",
  "cline",
  "codebuddy",
  "codewhale",
  "codex",
  "copilot",
  "cursor",
  "devin",
  "gemini-cli",
  "goose",
  "grok",
  "hermes",
  "jules",
  "junie",
  "kilo",
  "kimi",
  "kiro",
  "oh-my-pi",
  "openclaw",
  "opencode",
  "pi",
  "qoder",
  "qwen",
  "windsurf",
  "zed",
]
revision_policy = "host-marketplace-current"
targets = [
  { scope = "harness", path = "<codex-plugin-dir>/ponytail" },
  { scope = "global", path = "~/.config/ponytail/config.json" },
]
approval_disclosures = [
  "Affected agent hosts: Codex CLI and Codex Desktop.",
  "Codex installs Ponytail skills and two Node.js lifecycle hooks; open /hooks and review both hooks before trusting them.",
  "Ponytail documents no telemetry; its optional mode state remains under ~/.config/ponytail after host removal unless cleaned first.",
]
status_probes = [
  { harness = "claude", via = "plugin-cli", match = "ponytail@ponytail" },
  { harness = "codex", via = "plugin-cli", match = "ponytail" },
  { harness = "pi", via = "plugin-cli", match = "DietrichGebert/ponytail" },
]
[tool.skill_lifecycle.install]
mode = "manual-required"
instructions = [
  "After leaving the installer, run these official Codex commands in a console:",
  "codex plugin marketplace add DietrichGebert/ponytail",
  "codex plugin add ponytail@ponytail",
  "Run codex, open /hooks, review and trust both lifecycle hooks, then start a new thread.",
]
[tool.skill_lifecycle.install.by_harness]
aider = ["Copy AGENTS.md into the project."]
amp = ["Copy AGENTS.md to the project or to ~/.config/amp/AGENTS.md."]
antigravity = ["agy plugin install https://github.com/DietrichGebert/ponytail"]
claude = [
  "/plugin marketplace add DietrichGebert/ponytail",
  "/plugin install ponytail@ponytail",
]
cline = ["Copy .clinerules/ from the ponytail repo into the project."]
codebuddy = [
  "/plugin marketplace add DietrichGebert/ponytail",
  "/plugin install ponytail@ponytail",
]
codewhale = ["Copy AGENTS.md into the project, or run codewhale from a ponytail checkout."]
codex = [
  "codex plugin marketplace add DietrichGebert/ponytail",
  "codex plugin add ponytail@ponytail",
]
copilot = [
  "copilot plugin marketplace add DietrichGebert/ponytail",
  "copilot plugin install ponytail@ponytail",
]
cursor = [
  "git clone https://github.com/DietrichGebert/ponytail",
  "node ponytail/scripts/cursor-hooks.js install",
]
devin = ["devin plugins install DietrichGebert/ponytail"]
gemini-cli = ["gemini extensions install https://github.com/DietrichGebert/ponytail"]
goose = ["goose plugin install https://github.com/DietrichGebert/ponytail.git"]
grok = ["grok plugin install DietrichGebert/ponytail --trust"]
hermes = ["hermes plugins install DietrichGebert/ponytail --enable"]
jules = ["Copy AGENTS.md to the repository root."]
junie = ["Point Junie Guidelines Path at AGENTS.md."]
kilo = ['Add { "plugin": ["@dietrichgebert/ponytail"] } to kilo.jsonc or ~/.config/kilo/kilo.jsonc.']
kimi = ["/plugins install https://github.com/DietrichGebert/ponytail"]
kiro = ["Copy .kiro/steering/ponytail.md to ~/.kiro/steering/ or the project .kiro/steering/."]
oh-my-pi = [
  "omp plugin marketplace add DietrichGebert/ponytail",
  "omp plugin install ponytail@ponytail",
]
openclaw = ["clawhub install ponytail"]
opencode = ["opencode plugin add @dietrichgebert/ponytail"]
pi = ["pi install git:github.com/DietrichGebert/ponytail"]
qoder = ["qodercli plugins install <path-to-ponytail>"]
qwen = ["qwen extensions install DietrichGebert/ponytail:ponytail"]
windsurf = ["Copy .windsurf/rules/ from the ponytail repo into the project."]
zed = ["Copy AGENTS.md into the project."]
[tool.skill_lifecycle.status]
mode = "manual-required"
instructions = [
  "Run `codex plugin list` and look for ponytail@ponytail marked installed.",
]
[tool.skill_lifecycle.update]
mode = "manual-required"
instructions = [
  "Use the Codex plugin marketplace update flow for ponytail.",
  "Review the new release and both lifecycle hooks before trusting the updated plugin.",
]
[tool.skill_lifecycle.removal]
mode = "manual-required"
instructions = [
  "Before removing the plugin, run node scripts/uninstall.js from the installed Ponytail plugin directory to clean optional state.",
  "codex plugin remove ponytail",
  "In Claude Code: /plugin uninstall ponytail@ponytail",
]



[[tool]]
id = "openspec"
name = "OpenSpec"
category = "dev"
cmd = "openspec"
priority = "P2"
audience = "human"
desc = "Guided spec workflow; discloses anonymous telemetry and OPENSPEC_TELEMETRY=0; uninstall with pnpm."
tier = "ai"
