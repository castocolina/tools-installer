[project]
name = "tools-installer"
version = "0.1.0"
description = "Cross-platform interactive installer for an AI dev environment"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "questionary>=2",
    "textual>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["installer"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyright>=1.1.380",
    "ruff>=0.6",
    "bandit>=1.7",
    "vulture>=2.11",
    "pre-commit>=3.8",
    "shellcheck-py>=0.11.0.1",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260518",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["installer", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["installer"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.vulture]
paths = ["installer"]
min_confidence = 80
